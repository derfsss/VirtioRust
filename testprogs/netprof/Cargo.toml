[package]
name = "netprof"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "netprof"
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true

[dependencies]
amigaos4 = { path = "../../amigaos4", default-features = false, features = ["dos", "bsdsocket", "sana2", "timer", "utility"] }
