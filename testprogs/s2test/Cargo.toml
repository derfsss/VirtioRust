[package]
name = "s2test"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "s2test"
crate-type = ["staticlib"]
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[dependencies]
amigaos4 = { path = "../../amigaos4", default-features = false, features = ["dos", "device", "sana2", "timer"] }
